// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // The background-geolocation plugin ships its native AARs as a local
        // maven repo inside node_modules rather than publishing them to a
        // public one, so Gradle has to be pointed at it explicitly. Without
        // this, com.transistorsoft:tslocationmanager resolves nowhere and the
        // build fails at dependency resolution.
        maven {
            url "$rootDir/../node_modules/@transistorsoft/capacitor-background-geolocation/android/libs"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
