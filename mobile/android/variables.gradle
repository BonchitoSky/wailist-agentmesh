ext {
    minSdkVersion = 23
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // Android's own geofencing lives here. Free, OS-batched across
    // every app on the device, and the reason a paid background
    // tracking SDK is not required for enter/leave on a circle.
    playServicesLocationVersion = '21.3.0'
    // Keystore-backed EncryptedSharedPreferences, behind SecureStorePlugin.
    // 1.0.0 is the stable release and needs API 23, which is this app's
    // minSdk exactly. The 1.1.0 line is still alpha and a session token is
    // not the place to carry one.
    androidxSecurityCryptoVersion = '1.0.0'
}