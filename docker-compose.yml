      PLATFORM_WALLET_ENC_MNEMONIC: "H5FK4E549nJY6jqwt7R60tXmEiTTC4ePh8/zreBlbwbhxbti7F9VlHqIQKMZMTqQrYQK9+wvG75g9rsT5rlWAGjdsfjG3pN/Of7SMcwqy1AnOb4koBmSN8kruBZX/zApzOs9LMKkgUJpcIwhdmT1xsT/i2YbuCpzDTeyfe+2NzOnODSlPHUN7gw0akRZHPdoLGkMLznrCEZ6gbl5sKEAvcJ68JwsBxGzO4FPjt8v2zXxZbE1kf0HIrUVrQ=="
